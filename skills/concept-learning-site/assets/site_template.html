<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ — __SUBTITLE__</title>
<style>
:root{
  --bg:#0f1419; --panel:#161b22; --panel2:#1c2430; --border:#2a3441;
  --fg:#e6edf3; --muted:#8b98a8; --accent:#4a90d9; --accent2:#6fd99a;
  --warn:#d9b14a; --crit:#e05a5a; --recall:#9a6fd9;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--fg)}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}

/* progress bar */
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:50;transition:width .1s}

/* header */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;
  padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
header h1{font-size:16px;margin:0;white-space:nowrap}
header .ver{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace}
#search{flex:1;max-width:460px;padding:8px 12px;background:var(--panel2);
  border:1px solid var(--border);border-radius:8px;color:var(--fg);font-size:14px}
#search:focus{outline:none;border-color:var(--accent)}
#searchInfo{color:var(--muted);font-size:12px;white-space:nowrap;min-width:64px}
#menuBtn{display:none;background:var(--panel2);border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:6px 11px;font-size:16px;cursor:pointer}

.layout{display:flex;align-items:flex-start;min-height:calc(100vh - 54px)}

/* nav */
nav{position:sticky;top:54px;width:280px;flex:0 0 280px;max-height:calc(100vh - 54px);
  overflow:auto;padding:18px 10px;border-right:1px solid var(--border);background:var(--panel)}
nav .navtitle{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  padding:0 12px;margin-bottom:10px}
nav a{display:block;padding:7px 12px;border-radius:6px;color:var(--fg);margin-bottom:2px;
  font-size:13.5px;border-left:2px solid transparent;line-height:1.35}
nav a:hover{background:var(--panel2);text-decoration:none}
nav a.active{background:var(--panel2);color:var(--accent);font-weight:600;border-left-color:var(--accent)}

/* content */
main{flex:1;min-width:0;padding:32px 40px 120px;display:flex;justify-content:center}
.prose{max-width:780px;width:100%}
.prose h1{font-size:30px;margin:0 0 6px;line-height:1.2}
.prose .lede{color:var(--muted);font-size:15px;margin:0 0 28px}
.prose h2{font-size:23px;margin:46px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border);
  scroll-margin-top:70px}
.prose h2:first-of-type{margin-top:8px}
.prose h3{font-size:17px;color:var(--accent2);margin:30px 0 8px}
.prose h4{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 6px}
.prose p{margin:12px 0}
.prose ul,.prose ol{margin:12px 0;padding-left:24px}
.prose li{margin:5px 0}
.prose strong{color:#fff}
.prose blockquote{border-left:3px solid var(--accent);margin:16px 0;padding:6px 18px;
  color:var(--muted);background:var(--panel)}
.prose hr{border:none;border-top:1px solid var(--border);margin:32px 0}
.prose code{font-family:ui-monospace,monospace;background:var(--panel2);padding:1px 6px;
  border-radius:4px;font-size:13px}
.prose pre{background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:14px;overflow:auto;margin:14px 0}
.prose pre code{background:none;padding:0;font-size:13px;line-height:1.55}

/* tables */
.prose table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
.prose th,.prose td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.prose thead th{position:sticky;top:54px;background:var(--panel2);color:var(--muted);
  font-size:12px;text-transform:uppercase;letter-spacing:.4px;z-index:5}
.prose tbody tr:hover{background:var(--panel)}

/* active recall cards (details) */
.prose details{background:linear-gradient(180deg,rgba(154,111,217,.08),var(--panel));
  border:1px solid var(--recall);border-radius:10px;padding:0;margin:18px 0;overflow:hidden}
.prose details summary{cursor:pointer;padding:13px 16px;font-weight:600;color:var(--recall);
  list-style:none;display:flex;align-items:center;gap:9px}
.prose details summary::-webkit-details-marker{display:none}
.prose details summary::before{content:"?";display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:50%;background:var(--recall);color:#fff;font-size:12px;flex:0 0 20px}
.prose details[open] summary{border-bottom:1px solid var(--border)}
.prose details[open] summary::before{content:"✓";background:var(--accent2)}
.prose details > *:not(summary){margin-left:16px;margin-right:16px}
.prose details > p:last-child{margin-bottom:14px}

/* mermaid */
.mermaid{background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:18px;margin:18px 0;overflow:auto;cursor:zoom-in;text-align:center}
.mermaid svg{max-width:100%;height:auto}
.mm-hint{font-size:11px;color:var(--muted);margin:-10px 0 16px 2px}
.mm-lightbox{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);
  display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.mm-lightbox-inner{max-width:95vw;max-height:92vh;overflow:auto;background:var(--panel);
  border:1px solid var(--border);border-radius:12px;padding:26px}

/* search highlight */
mark{background:var(--warn);color:#000;border-radius:2px;padding:0 1px}
mark.current{background:var(--accent2);outline:2px solid var(--accent2)}

/* citace, cross-ref, zdroje */
.prose a.cite{color:var(--accent2);font-weight:600;font-size:.9em;text-decoration:none;white-space:nowrap}
.prose a.cite:hover{text-decoration:underline}
.prose a.xref{color:var(--accent);border-bottom:1px dotted var(--accent);text-decoration:none}
.prose a.xref:hover{border-bottom-style:solid}
.prose td a[href^="http"]{word-break:break-word;color:var(--accent)}
.prose tr.flash{background:rgba(111,217,154,.18);transition:background 1.4s}
.prose tbody tr{scroll-margin-top:64px}

@media(max-width:880px){
  #menuBtn{display:block}
  nav{position:fixed;top:54px;left:0;bottom:0;z-index:25;transform:translateX(-100%);
    transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.4)}
  nav.open{transform:translateX(0)}
  main{padding:22px 18px 100px}
  #searchInfo{display:none}
}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* photos */
.prose figure{margin:18px 0;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.prose figure img{display:block;width:100%;height:auto;cursor:zoom-in}
.prose figcaption{padding:8px 12px;color:var(--muted);font-size:12.5px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:18px 0}
.gallery figure{margin:0}.gallery img{height:175px;width:100%;object-fit:cover;cursor:zoom-in}
.photocredit{color:var(--muted);font-size:11.5px;margin-top:6px}
/* maps */
.cls-map{height:520px;border:1px solid var(--border);border-radius:10px;margin:18px 0;z-index:1}
.leaflet-popup-content{font:13px/1.5 -apple-system,sans-serif;margin:10px 12px}
.leaflet-container{background:#0b0e12}
.maplegend{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--fg);line-height:1.8}
.maplegend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:middle}
.maphint{font-size:11.5px;color:var(--muted);margin:-8px 0 14px 2px}
.routenum{background:none;border:none}
.routenum span{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
  color:#fff;font-size:13px;font-weight:700;border:2px solid #0b0e12}
</style>
</head>
<body>
<div id="progress"></div>
<header>
  <button id="menuBtn" aria-label="menu">&#9776;</button>
  <h1>__TITLE__ <span class="ver">__VERSION__</span></h1>
  <input id="search" type="search" placeholder="Hledat v textu&#8230; (Enter = dalsi)" autocomplete="off">
  <span id="searchInfo"></span>
</header>
<div class="layout">
  <nav id="nav"><div class="navtitle">Obsah</div></nav>
  <main><article class="prose" id="content"></article></main>
</div>

<script type="text/markdown" id="src">__CONTENT__</script>
<script src="assets/marked.min.js"></script>
<script src="assets/mermaid.min.js"></script>
<script>
// --- render markdown ---
const raw = document.getElementById('src').textContent;
const content = document.getElementById('content');
marked.setOptions({gfm:true, breaks:false});
content.innerHTML = marked.parse(raw);

// --- prvni H1 jako lede oddeleni: H1 zustava, prvni odstavec za nim dostane .lede ---
(function(){
  const h1 = document.querySelector('.prose h1');
  if(h1 && h1.nextElementSibling && h1.nextElementSibling.tagName==='P'){
    h1.nextElementSibling.classList.add('lede');
  }
})();

// --- prevest mermaid code-bloky na div.mermaid ---
document.querySelectorAll('pre > code.language-mermaid').forEach(code=>{
  const div=document.createElement('div');
  div.className='mermaid';
  div.textContent=code.textContent;
  code.parentElement.replaceWith(div);
});

// --- slugify + ID na H2, build nav ---
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
const nav=document.getElementById('nav');
const heads=[...document.querySelectorAll('.prose h2')];
heads.forEach(h=>{
  if(!h.id) h.id=slug(h.textContent);
  const a=document.createElement('a');
  a.href='#'+h.id; a.textContent=h.textContent.replace(/^\d+(\.\d+)*\.?\s*/,'');
  a.dataset.target=h.id;
  nav.appendChild(a);
});

// --- ID na H3 + mapa cisel sekci (pro cross-ref) ---
const numMap={};
[...document.querySelectorAll('.prose h2, .prose h3')].forEach(h=>{
  if(!h.id) h.id=slug(h.textContent);
  const m=h.textContent.match(/^(\d+(?:\.\d+)?)[.\s]/);
  if(m) numMap[m[1]]=h.id;
});

// --- helper: projdi text nodes mimo code/pre/a/.mermaid (volitelne mimo nadpisy) ---
function walkText(fn,skipHeads){
  const w=document.createTreeWalker(content,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    let p=n.parentElement;
    while(p && p!==content){
      const t=p.tagName;
      if(t==='A'||t==='CODE'||t==='PRE'||p.classList.contains('mermaid')) return NodeFilter.FILTER_REJECT;
      if(skipHeads && (t==='H1'||t==='H2'||t==='H3'||t==='H4')) return NodeFilter.FILTER_REJECT;
      p=p.parentElement;
    }
    return NodeFilter.FILTER_ACCEPT;
  }});
  const arr=[]; let n; while(n=w.nextNode()) arr.push(n);
  arr.forEach(fn);
}
function replaceNode(node,regex,build){
  const txt=node.nodeValue; regex.lastIndex=0;
  if(!regex.test(txt)) return; regex.lastIndex=0;
  const frag=document.createDocumentFragment(); let last=0,m;
  while(m=regex.exec(txt)){
    if(m.index>last) frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
    frag.appendChild(build(m)); last=m.index+m[0].length;
    if(m.index===regex.lastIndex) regex.lastIndex++;
  }
  if(last<txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
  node.parentNode.replaceChild(frag,node);
}

// 1) autolink holych URL (typicky v tabulce zdroju)
walkText(n=>replaceNode(n,/https?:\/\/[^\s)<>\]]+/g,m=>{
  const a=document.createElement('a'); a.href=m[0]; a.textContent=m[0];
  a.target='_blank'; a.rel='noopener'; return a;
}),false);

// 2) radky tabulek -> kotvy podle cisla v prvnim sloupci (sekce Zdroje)
[...document.querySelectorAll('.prose table')].forEach(tab=>{
  [...tab.querySelectorAll('tbody tr')].forEach(tr=>{
    const c0=tr.querySelector('td'); if(!c0) return;
    const num=c0.textContent.trim().match(/^(\d+)$/);
    if(num) tr.id='src-'+num[1];
  });
});

// 3) citace [n] -> odkaz na radek zdroje (smooth scroll + flash)
walkText(n=>replaceNode(n,/\[(\d+)\]/g,m=>{
  const a=document.createElement('a'); a.className='cite'; a.href='#src-'+m[1];
  a.textContent='['+m[1]+']'; a.title='Zdroj '+m[1];
  a.addEventListener('click',e=>{
    const tr=document.getElementById('src-'+m[1]);
    if(tr){e.preventDefault(); tr.scrollIntoView({behavior:'smooth',block:'center'});
      tr.classList.add('flash'); setTimeout(()=>tr.classList.remove('flash'),1400);}
  });
  return a;
}),true);

// 4) cross-ref "sekce N(.N)" -> odkaz na nadpis
walkText(n=>replaceNode(n,/(sekc\w*)(\s+)(\d+(?:\.\d+)?)/gi,m=>{
  const id=numMap[m[3]]; const span=document.createElement('span');
  if(!id){ span.textContent=m[0]; return span; }
  span.appendChild(document.createTextNode(m[1]+m[2]));
  const a=document.createElement('a'); a.className='xref'; a.href='#'+id; a.textContent=m[3];
  span.appendChild(a); return span;
}),true);

// --- mermaid render ---
mermaid.initialize({startOnLoad:false, theme:'dark', securityLevel:'loose',
  themeVariables:{fontSize:'14px'}});
mermaid.run({querySelector:'.mermaid'}).catch(e=>console.error('mermaid',e));

// --- lightbox ---
document.addEventListener('click',e=>{
  const box=e.target.closest && e.target.closest('.mermaid');
  if(box && !e.target.closest('.mm-lightbox')){
    const svg=box.querySelector('svg'); if(!svg) return;
    const ov=document.createElement('div'); ov.className='mm-lightbox';
    const inner=document.createElement('div'); inner.className='mm-lightbox-inner';
    const c=svg.cloneNode(true); c.style.maxWidth='none'; c.style.width='90vw'; c.style.height='auto';
    inner.appendChild(c); ov.appendChild(inner);
    ov.addEventListener('click',()=>ov.remove());
    document.body.appendChild(ov);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const ov=document.querySelector('.mm-lightbox'); if(ov) ov.remove();}
});

// --- scrollspy ---
const navLinks=[...nav.querySelectorAll('a')];
const byId=id=>navLinks.find(a=>a.dataset.target===id);
const spy=new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(en.isIntersecting){
      navLinks.forEach(a=>a.classList.remove('active'));
      const a=byId(en.target.id); if(a) a.classList.add('active');
    }
  });
},{rootMargin:'-60px 0px -75% 0px'});
heads.forEach(h=>spy.observe(h));

// --- reading progress ---
const prog=document.getElementById('progress');
function updProg(){
  const h=document.documentElement;
  const max=h.scrollHeight-h.clientHeight;
  prog.style.width=(max>0?(h.scrollTop/max*100):0)+'%';
}
window.addEventListener('scroll',updProg,{passive:true});
updProg();

// --- mobile menu ---
const menuBtn=document.getElementById('menuBtn');
menuBtn.addEventListener('click',()=>nav.classList.toggle('open'));
navLinks.forEach(a=>a.addEventListener('click',()=>nav.classList.remove('open')));

// --- live search (highlight + jump) ---
const search=document.getElementById('search');
const info=document.getElementById('searchInfo');
let marks=[], cur=-1;
function clearMarks(){
  marks.forEach(m=>{const p=m.parentNode; p.replaceChild(document.createTextNode(m.textContent),m); p.normalize();});
  marks=[]; cur=-1; info.textContent='';
}
function doSearch(q){
  clearMarks();
  if(!q || q.length<2){return;}
  const rx=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  const walk=document.createTreeWalker(content,NodeFilter.SHOW_TEXT,{
    acceptNode:n=>{
      if(!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p=n.parentNode.nodeName;
      if(p==='SCRIPT'||p==='STYLE'||n.parentNode.classList.contains('mermaid')) return NodeFilter.FILTER_REJECT;
      return rx.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
    }
  });
  const targets=[]; let n;
  while(n=walk.nextNode()) targets.push(n);
  targets.forEach(node=>{
    rx.lastIndex=0;
    const frag=document.createDocumentFragment();
    let last=0, txt=node.nodeValue, m;
    while(m=rx.exec(txt)){
      if(m.index>last) frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      const mk=document.createElement('mark'); mk.textContent=m[0];
      frag.appendChild(mk); marks.push(mk); last=m.index+m[0].length;
      if(m.index===rx.lastIndex) rx.lastIndex++;
    }
    if(last<txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
  info.textContent=marks.length?('0/'+marks.length):'0';
  if(marks.length){cur=-1; nextMark();}
}
function nextMark(){
  if(!marks.length) return;
  if(cur>=0) marks[cur].classList.remove('current');
  cur=(cur+1)%marks.length;
  marks[cur].classList.add('current');
  marks[cur].scrollIntoView({behavior:'smooth',block:'center'});
  info.textContent=(cur+1)+'/'+marks.length;
}
let t;
search.addEventListener('input',e=>{clearTimeout(t); t=setTimeout(()=>doSearch(e.target.value.trim()),200);});
search.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); if(marks.length) nextMark(); else doSearch(search.value.trim());}
  if(e.key==='Escape'){search.value=''; clearMarks();}});

// --- deep-link na hash ---
if(location.hash){const el=document.getElementById(location.hash.slice(1)); if(el) setTimeout(()=>el.scrollIntoView(),100);}
</script>
<script type="application/json" id="site-data">__SITEDATA__</script>
<script src="assets/site_engine.js"></script>
</body>
</html>
